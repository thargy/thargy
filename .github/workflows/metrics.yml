name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Runs every night at midnight UTC
  workflow_dispatch:     # Allows manual triggering at any time

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics image
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thargy
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/London
          config_order: base.header, base.activity, base.community, base.repositories, languages
          
          # Include personal and organisation repositories
          repositories_affiliations: owner, collaborator, organization_member
          
          # Commit the SVG back to the repository root
          output_action: commit
          committer_message: "chore: update metrics [skip ci]"
          filename: github-metrics.svg
          
          # Languages plugin configuration
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
